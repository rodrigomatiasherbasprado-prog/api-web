name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      # GitHub tarda unos segundos en listar el paquete recién subido; sin esta espera la publicación puede fallar.
      - name: Esperar a que el paquete esté disponible
        run: sleep 30
      - id: despliegue
        uses: actions/deploy-pages@v4
